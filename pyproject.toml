[project]
name = "wizora-ai"
version = "1.0.0"
description = "Wizora-AI backend for educational agents and document processing."
requires-python = ">=3.11,<3.12"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = [
    "aiosqlite==0.21.0",
    "anyio==4.15.1",
    "chromadb==1.0.10",
    "charset-normalizer==3.5.2",
    "fastapi==0.115.9",
    "gradio==6.10.0",
    "google-api-core==2.30.3",
    "httpx==0.28.1",
    "imageio-ffmpeg==0.6.0",
    "langchain-community==0.3.16",
    "langchain-core==0.3.59",
    "langchain-huggingface==0.2.0",
    "langchain-text-splitters==0.3.5",
    "langgraph==0.3.31",
    "langgraph-checkpoint-sqlite==2.0.11",
    "langsmith==0.3.4",
    "lxml==6.1.3",
    "numpy==1.26.4",
    "openai==1.109.1",
    "openai-whisper==20250625",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "pillow==12.3.0",
    "pymupdf==1.26.0",
    "python-docx==1.2.0",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.20",
    "sentence-transformers==4.1.0",
    "torch==2.14.1",
    "typing-extensions==4.16.0",
    "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = ["ruff==0.14.2"]

[tool.uv]
constraint-dependencies = ["posthog<6", "protobuf==5.29.4"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python", "assets", "runtime", "output", "video_used_for_test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# dotenv must populate tracing/SDK environment before backend imports.
"main.py" = ["E402"]
